.shared-rules: &shared-rules
  rules:
  - if: '($PROVIDER != null) && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    when: manual

prepare:
  <<: *shared-rules
  when: on_success
  needs:
    - job: aws-provision
      artifacts: true
      optional: true
    - job: gcp-provision
      artifacts: true
      optional: true
    - job: do-provision
      artifacts: true
      optional: true
  extends:
    - .remote-access-template
    - .install-tools-template
